<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-label="Cachorro feliz tomando banho na MAXX Pet Shop">
  <defs>
    <linearGradient id="bgBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="dogBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4D9B3"/>
      <stop offset="1" stop-color="#E8B883"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E0F2F1" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="round"><rect width="600" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background blob -->
    <path class="hero-stroke" d="M120 280 C90 180, 200 90, 320 100 S520 180, 510 290 C500 400, 380 450, 270 430 S150 380, 120 280 Z"
          fill="url(#bgBlob)" stroke="#0F766E" stroke-width="2" stroke-opacity="0.25" stroke-linecap="round"/>

    <!-- Decorative paw prints -->
    <g class="paw-deco" fill="#0F766E" opacity="0.12">
      <g transform="translate(80 120) rotate(-15)">
        <ellipse cx="0" cy="0" rx="14" ry="11"/>
        <ellipse cx="-12" cy="-14" rx="5" ry="7"/>
        <ellipse cx="-3" cy="-19" rx="5" ry="7"/>
        <ellipse cx="8" cy="-19" rx="5" ry="7"/>
        <ellipse cx="16" cy="-14" rx="5" ry="7"/>
      </g>
      <g transform="translate(520 90) rotate(25)">
        <ellipse cx="0" cy="0" rx="10" ry="8"/>
        <ellipse cx="-9" cy="-10" rx="4" ry="5"/>
        <ellipse cx="-2" cy="-14" rx="4" ry="5"/>
        <ellipse cx="6" cy="-14" rx="4" ry="5"/>
        <ellipse cx="12" cy="-10" rx="4" ry="5"/>
      </g>
      <g transform="translate(560 380) rotate(-30)">
        <ellipse cx="0" cy="0" rx="12" ry="9"/>
        <ellipse cx="-10" cy="-12" rx="4" ry="6"/>
        <ellipse cx="-2" cy="-16" rx="4" ry="6"/>
        <ellipse cx="6" cy="-16" rx="4" ry="6"/>
        <ellipse cx="14" cy="-12" rx="4" ry="6"/>
      </g>
    </g>

    <!-- Tub (ground) -->
    <path class="hero-stroke" d="M150 380 L450 380 L420 430 L180 430 Z" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round"/>
    <path class="hero-stroke" d="M165 395 L435 395" stroke="#0F766E" stroke-width="1.5" opacity="0.4"/>

    <!-- Dog body -->
    <g class="dog-group">
      <!-- body -->
      <path class="hero-stroke" d="M230 360 C210 320, 215 280, 250 270 C290 258, 340 260, 370 275 C400 285, 410 320, 395 360 C380 388, 340 395, 300 392 C260 390, 240 380, 230 360 Z"
            fill="url(#dogBody)" stroke="#8B5E3C" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- head -->
      <circle class="hero-stroke" cx="395" cy="245" r="48" fill="url(#dogBody)" stroke="#8B5E3C" stroke-width="2.5"/>
      <!-- ear floppy -->
      <path class="hero-stroke" d="M420 215 C455 200, 470 235, 458 270 C450 285, 432 282, 425 268 Z"
            fill="#C9986A" stroke="#8B5E3C" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- snout -->
      <ellipse class="hero-stroke" cx="430" cy="258" rx="22" ry="18" fill="#F8E4C8" stroke="#8B5E3C" stroke-width="2"/>
      <!-- nose -->
      <ellipse cx="448" cy="250" rx="5" ry="4" fill="#0F172A"/>
      <!-- mouth -->
      <path d="M438 268 Q445 274 452 268" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- eye -->
      <circle cx="408" cy="238" r="3.5" fill="#0F172A"/>
      <circle cx="409" cy="237" r="1" fill="#FFFFFF"/>
      <!-- eyebrow happy -->
      <path d="M402 230 Q408 226 414 230" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- spot -->
      <ellipse cx="295" cy="305" rx="22" ry="15" fill="#C9986A" opacity="0.7"/>
    </g>

    <!-- Soap bubble on top of head -->
    <g class="bubble">
      <circle class="hero-stroke" cx="370" cy="190" r="14" fill="url(#bubble)" stroke="#0F766E" stroke-width="1.5"/>
      <circle cx="365" cy="186" r="3" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Floating bubbles -->
    <g class="bubbles">
      <circle class="hero-stroke" cx="475" cy="160" r="10" fill="url(#bubble)" stroke="#0F766E" stroke-width="1.3" opacity="0.9"/>
      <circle class="hero-stroke" cx="500" cy="220" r="6" fill="url(#bubble)" stroke="#0F766E" stroke-width="1.2" opacity="0.85"/>
      <circle class="hero-stroke" cx="180" cy="200" r="8" fill="url(#bubble)" stroke="#0F766E" stroke-width="1.3" opacity="0.9"/>
      <circle class="hero-stroke" cx="155" cy="280" r="5" fill="url(#bubble)" stroke="#0F766E" stroke-width="1.2" opacity="0.8"/>
      <circle class="hero-stroke" cx="455" cy="120" r="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1" opacity="0.7"/>
    </g>

    <!-- Sparkles -->
    <g class="sparkle" fill="#F59E0B">
      <path d="M530 300 L534 308 L542 310 L534 312 L530 320 L526 312 L518 310 L526 308 Z"/>
      <path d="M120 340 L122 345 L127 346 L122 347 L120 352 L118 347 L113 346 L118 345 Z" opacity="0.7"/>
      <path d="M490 350 L493 357 L500 360 L493 363 L490 370 L487 363 L480 360 L487 357 Z" opacity="0.6"/>
    </g>

    <!-- Floating heart -->
    <g class="heart-float" transform="translate(220 170)">
      <path d="M0 0 C-8 -8, -16 0, 0 12 C16 0, 8 -8, 0 0 Z" fill="#F59E0B" opacity="0.85"/>
    </g>
  </g>
</svg>
